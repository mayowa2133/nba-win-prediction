name: CrossoverInsights
options:
  minimumXcodeGenVersion: 2.45.0
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    CROSSOVER_API_BASE_URL: ""
targets:
  CrossoverInsights:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayowaadesanya.crossoverinsights
        PRODUCT_NAME: CrossoverInsights
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crossover Insights
        INFOPLIST_KEY_CrossoverAPIBaseURL: $(CROSSOVER_API_BASE_URL)
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        Release:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
