[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-betting-beta"
version = "0.1.0"
description = "Research pipeline and beta API for precomputed NBA betting recommendations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Mayowa Adesanya" }
]
dependencies = [
  "beautifulsoup4>=4.12,<5.0",
  "fastapi>=0.115,<1.0",
  "nba_api>=1.11,<2.0",
  "numpy>=2.3,<3.0",
  "pandas>=2.3,<3.0",
  "psycopg>=3.2,<4.0",
  "pypdf>=5.4,<6.0",
  "pydantic>=2.9,<3.0",
  "requests>=2.32,<3.0",
  "scikit-learn>=1.7,<2.0",
  "scipy>=1.16,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
  "xgboost>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
